###############################################
# GLOBAL BUILD SETTINGS
###############################################
[build]
  publish = ".next"
  command = "npm run supa:migrate && npm run build"

###############################################
# SUPABASE MIGRATIONS SCRIPT
###############################################
# Configurado no package.json como:
# "supa:migrate": "supabase migration up --db-url \"$SUPABASE_DB_URL\""
#
# Configure SUPABASE_DB_URL no Netlify com o formato:
# postgresql://postgres:[PASSWORD]@db.[PROJECT_REF].supabase.co:6543/postgres?sslmode=require
#
# IMPORTANTE: Use a porta 6543 (Session Pooler) para compatibilidade IPv4
###############################################

###############################################
# PLUGINS
###############################################
[[plugins]]
  package = "@netlify/plugin-nextjs"

###############################################
# PRODUCTION CONTEXT (PRINCIPAL)
###############################################
[context.production.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

###############################################
# DEPLOY PREVIEW
###############################################
[context.deploy-preview.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

###############################################
# BRANCH DEPLOY
###############################################
[context.branch-deploy.environment]
  NODE_ENV = "development"
  NODE_VERSION = "22"

###############################################
# DEV
###############################################
[context.dev.environment]
  NODE_ENV = "development"
  NODE_VERSION = "22"

###############################################
# HEADERS
###############################################
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    cache-control = "max-age=0, no-cache, no-store, must-revalidate"

###############################################
# END
###############################################
