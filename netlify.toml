###############################################
# GLOBAL BUILD SETTINGS
###############################################
[build]
  publish = ".next"
  command = "npm run supa:migrate && npm run supa:deploy-functions && npm run build"

###############################################
# SUPABASE CONFIGURATION
###############################################
# MIGRATIONS:
# Configurado no package.json como:
# "supa:migrate": "supabase migration up --db-url \"$SUPABASE_DB_URL\""
#
# Configure SUPABASE_DB_URL no Netlify com o formato:
# postgresql://postgres:[PASSWORD]@db.[PROJECT_REF].supabase.co:6543/postgres?sslmode=require
#
# EDGE FUNCTIONS:
# Configurado no package.json como:
# "supa:deploy-functions": "supabase functions deploy --project-ref \"$SUPABASE_PROJECT_REF\""
#
# Configure as seguintes variáveis de ambiente no Netlify:
# - SUPABASE_PROJECT_REF: seu-project-ref (ex: abcdefghijklmnop)
# - SUPABASE_ACCESS_TOKEN: seu-access-token (gerado em https://app.supabase.com/account/tokens)
# - SUPABASE_DB_URL: connection string (para migrations)
#
# IMPORTANTE:
# - Use a porta 6543 (Session Pooler) no SUPABASE_DB_URL para compatibilidade IPv4
# - O access token deve ter permissões de deploy
###############################################

###############################################
# PLUGINS
###############################################
[[plugins]]
  package = "@netlify/plugin-nextjs"

###############################################
# PRODUCTION CONTEXT (PRINCIPAL)
###############################################
[context.production.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

###############################################
# DEPLOY PREVIEW
###############################################
[context.deploy-preview.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

###############################################
# BRANCH DEPLOY
###############################################
[context.branch-deploy.environment]
  NODE_ENV = "development"
  NODE_VERSION = "22"

###############################################
# DEV
###############################################
[context.dev.environment]
  NODE_ENV = "development"
  NODE_VERSION = "22"

###############################################
# HEADERS
###############################################
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    cache-control = "max-age=0, no-cache, no-store, must-revalidate"

###############################################
# END
###############################################
