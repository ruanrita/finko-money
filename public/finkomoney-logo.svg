<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="120" height="120" rx="24" fill="url(#bgGradient)"/>

  <!-- Wallet icon -->
  <g transform="translate(30, 30)">
    <!-- Wallet body -->
    <rect x="5" y="20" width="50" height="35" rx="4" fill="white" opacity="0.9"/>

    <!-- Wallet flap -->
    <path d="M 5 20 L 5 15 Q 5 10 10 10 L 50 10 Q 55 10 55 15 L 55 20 Z" fill="white"/>

    <!-- Wallet closure line -->
    <line x1="5" y1="20" x2="55" y2="20" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>

    <!-- Card detail -->
    <rect x="12" y="30" width="36" height="6" rx="2" fill="#3b82f6" opacity="0.3"/>

    <!-- Money symbol -->
    <text x="30" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3b82f6" text-anchor="middle">$</text>
  </g>
</svg>
